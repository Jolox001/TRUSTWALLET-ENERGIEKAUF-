<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUSTWALLET [ ENERGIEKAUF ]</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 720px;
            text-align: center;
            background: rgba(18, 24, 38, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            padding: 2.5rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 500px) {
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .time-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.25rem 0.5rem;
            border-radius: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .time-box:hover {
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .time-box span {
            display: block;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #38bdf8;
            line-height: 1.1;
        }

        .time-box label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.5rem;
        }

        .target-info {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 500;
        }

        .completed-message {
            font-size: 1.75rem;
            font-weight: 700;
            color: #10b981;
            padding: 2rem 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-badge">Official Event</div>
        <h1>TRUSTWALLET [ ENERGIEKAUF ]</h1>

        <div class="countdown-grid" id="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Minutes</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Seconds</label>
            </div>
        </div>

        <div class="target-info">Target Date: October 30 at 21:00</div>
    </div>

    <script>
        // Calculates the next October 30th at 21:00:00
        function getTargetDate() {
            const now = new Date();
            let year = now.getFullYear();
            let target = new Date(`October 30, ${year} 21:00:00`).getTime();
            
            // If the date for this year has passed, target next year
            if (now.getTime() > target) {
                target = new Date(`October 30, ${year + 1} 21:00:00`).getTime();
            }
            return target;
        }

        const targetTime = getTargetDate();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetTime - now;

            if (distance <= 0) {
                document.getElementById("countdown").innerHTML = 
                    '<div class="completed-message">EVENT HAS STARTED</div>';
                clearInterval(timerInterval);
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
